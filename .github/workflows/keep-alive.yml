# Keep the Render free backend awake 24/7 (no cold starts).
#
# ENABLED BY DEFAULT: pings the backend every 10 minutes from the next push.
# The backend URL is hardcoded below — no repository secret is needed.
#
# To turn it OFF later: disable the workflow via
# Actions tab → Keep-alive (Render backend) → ⋯ → Disable workflow.
#
# ── Cost trade-off ────────────────────────────────────────────────────────
# 24/7 keep-alive consumes ~744 of Render's 750 monthly FREE instance-hours.
# Fine for exactly one always-on free service; do NOT enable if your Render
# workspace also runs other free services (they'd get suspended mid-month).
# Never shorten the cron interval below 10 minutes.
name: Keep-alive (Render backend)

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:          # allows manual runs from the Actions tab

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: false

env:
  BACKEND_URL: https://mplads-drishti-codeholics-api-wqbj.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Pinging $BACKEND_URL/api/v1/health ..."
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 90 \
            "$BACKEND_URL/api/v1/health") || code=000
          echo "HTTP status: $code"
          # 000 = network timeout (backend likely still waking); tolerate it.
          if [ "$code" = "200" ]; then
            echo "Backend is awake."
          else
            echo "::warning::Backend responded with $code (may still be waking up)."
          fi
