services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
# NOTE: the database FILENAME stays drishti.db for compatibility with
# existing local/demo databases. Renaming it would silently orphan data.
    container_name: trinetra-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8317}:8000"
    environment:
      - APP_ENV=development
      - DEMO_AUTOSEED=true
      - DATABASE_URL=sqlite:////app/data/drishti.db
      - REPORT_STORAGE_PATH=/app/reports
      - CORS_ORIGINS=http://localhost:5317,http://localhost:5199,http://127.0.0.1:5317,http://127.0.0.1:5199
    volumes:
      - trinetra-data:/app/data
      - trinetra-reports:/app/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - trinetra-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trinetra-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5317}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - trinetra-network

# Volume KEYS are renamed to trinetra-*, but the underlying Docker volume
# names are pinned to the historical ones so existing local developer data
# (demo database, generated reports) survives the rename untouched.
volumes:
  trinetra-data:
    name: drishti-data
  trinetra-reports:
    name: drishti-reports

networks:
  trinetra-network:
    driver: bridge
