<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- TRINETRA mark: a surveyor's eye over a compass baseline.
       "TRINETRA" = vision/insight; the iris is an audit aperture. -->
  <rect width="64" height="64" rx="12" fill="#141a24"/>
  <!-- eye outline -->
  <path d="M8 32 C16 20, 48 20, 56 32 C48 44, 16 44, 8 32 Z"
        fill="none" stroke="#e8e4d8" stroke-width="3.2" stroke-linejoin="round"/>
  <!-- iris -->
  <circle cx="32" cy="32" r="9.5" fill="none" stroke="#d9a13c" stroke-width="3"/>
  <!-- pupil -->
  <circle cx="32" cy="32" r="3.4" fill="#d9a13c"/>
  <!-- crosshair ticks: measurement/audit -->
  <line x1="32" y1="10.5" x2="32" y2="16.5" stroke="#d9a13c" stroke-width="2.6"/>
  <line x1="32" y1="47.5" x2="32" y2="53.5" stroke="#d9a13c" stroke-width="2.6"/>
  <line x1="53.5" y1="32" x2="59.5" y2="32" stroke="#d9a13c" stroke-width="2.6" opacity="0.55"/>
  <line x1="4.5" y1="32" x2="10.5" y2="32" stroke="#d9a13c" stroke-width="2.6" opacity="0.55"/>
</svg>
